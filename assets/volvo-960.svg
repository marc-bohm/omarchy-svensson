<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- 1991 Volvo 960 at sunset, synthwave style. Front faces the camera,
       the sun sits behind the roof so the body is backlit with a pink rim. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140828"/>
      <stop offset="0.30" stop-color="#3d1160"/>
      <stop offset="0.52" stop-color="#9a2378"/>
      <stop offset="0.66" stop-color="#ff4f7b"/>
      <stop offset="0.75" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="0.45" stop-color="#ffd166"/>
      <stop offset="0.8" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ff4f7b"/>
    </linearGradient>
    <mask id="sunStripes">
      <rect x="0" y="0" width="1600" height="900" fill="#fff"/>
      <rect x="0" y="452" width="1600" height="4" fill="#000"/>
      <rect x="0" y="474" width="1600" height="7" fill="#000"/>
      <rect x="0" y="498" width="1600" height="10" fill="#000"/>
      <rect x="0" y="525" width="1600" height="13" fill="#000"/>
      <rect x="0" y="555" width="1600" height="16" fill="#000"/>
      <rect x="0" y="588" width="1600" height="20" fill="#000"/>
    </mask>
    <linearGradient id="farHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b03a86"/>
      <stop offset="1" stop-color="#4a175e"/>
    </linearGradient>
    <linearGradient id="nearHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1a5c"/>
      <stop offset="1" stop-color="#1c0a28"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f36"/>
      <stop offset="1" stop-color="#0a0510"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a44"/>
      <stop offset="1" stop-color="#0d0714"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a68"/>
      <stop offset="0.5" stop-color="#2c2244"/>
      <stop offset="1" stop-color="#171226"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a86"/>
      <stop offset="1" stop-color="#3a2c55"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2c55"/>
      <stop offset="1" stop-color="#231a36"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a8a"/>
      <stop offset="0.35" stop-color="#e2508e"/>
      <stop offset="0.75" stop-color="#5a2272"/>
      <stop offset="1" stop-color="#221034"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset="0.45" stop-color="#b9a2d6"/>
      <stop offset="0.55" stop-color="#6d5a8c"/>
      <stop offset="1" stop-color="#e6d3ff"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#fff4cf"/>
      <stop offset="1" stop-color="#ffc56b"/>
    </radialGradient>
    <radialGradient id="warmPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a8a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7a8a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur14"><feGaussianBlur stdDeviation="14"/></filter>
    <!-- Volumetric light: bright at the lamp, gone by the time it reaches the road -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c8" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#ffdf96" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffd98f" stop-opacity="0"/>
    </linearGradient>
    <!-- Fenders curve away from the camera, so both outer edges fall into shadow -->
    <linearGradient id="fenderShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0612" stop-opacity="0.6"/>
      <stop offset="0.16" stop-color="#0a0612" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#0a0612" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#0a0612" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0a0612" stop-opacity="0.6"/>
    </linearGradient>
    <!-- The hood lip overhangs the fascia and drops a shadow onto it -->
    <linearGradient id="lipShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07040d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#07040d" stop-opacity="0"/>
    </linearGradient>
    <!-- Sheet metal catches the sunset from above and goes dark towards the bumper -->
    <linearGradient id="panelFall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3d9" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#ffb3d9" stop-opacity="0"/>
      <stop offset="1" stop-color="#06030b" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="backGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7ab8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff7ab8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="120" cy="60" r="1.6"/><circle cx="310" cy="120" r="1.2"/><circle cx="520" cy="40" r="1.8"/>
    <circle cx="700" cy="95" r="1.1"/><circle cx="930" cy="55" r="1.5"/><circle cx="1120" cy="130" r="1.2"/>
    <circle cx="1290" cy="45" r="1.7"/><circle cx="1480" cy="100" r="1.3"/><circle cx="230" cy="190" r="1"/>
    <circle cx="1400" cy="200" r="1"/><circle cx="860" cy="170" r="0.9"/>
  </g>

  <!-- Cloud streaks -->
  <g filter="url(#soft)">
    <ellipse cx="240" cy="200" rx="320" ry="12" fill="#ff6fa8" opacity="0.75"/>
    <ellipse cx="420" cy="238" rx="240" ry="8" fill="#ffab70" opacity="0.7"/>
    <ellipse cx="120" cy="272" rx="200" ry="7" fill="#ff8fb8" opacity="0.6"/>
    <ellipse cx="660" cy="140" rx="280" ry="8" fill="#d45aa8" opacity="0.6"/>
    <ellipse cx="900" cy="112" rx="200" ry="6" fill="#ff7ab0" opacity="0.5"/>
    <ellipse cx="1260" cy="180" rx="360" ry="13" fill="#ff6fa8" opacity="0.7"/>
    <ellipse cx="1130" cy="222" rx="230" ry="7" fill="#ffc07a" opacity="0.75"/>
    <ellipse cx="1460" cy="262" rx="200" ry="7" fill="#ffb07a" opacity="0.7"/>
    <ellipse cx="1000" cy="300" rx="160" ry="5" fill="#ffd28a" opacity="0.6"/>
    <ellipse cx="300" cy="330" rx="190" ry="5" fill="#ffb07a" opacity="0.55"/>
    <ellipse cx="1420" cy="360" rx="150" ry="5" fill="#ffd28a" opacity="0.6"/>
  </g>
  <g filter="url(#blur2)" opacity="0.85">
    <ellipse cx="300" cy="196" rx="170" ry="3" fill="#ffd0e4"/>
    <ellipse cx="1210" cy="176" rx="200" ry="3" fill="#ffd9c0"/>
    <ellipse cx="1110" cy="219" rx="120" ry="2.5" fill="#fff0c8"/>
  </g>

  <!-- Sun -->
  <circle cx="1190" cy="430" r="290" fill="#ff7a59" opacity="0.5" filter="url(#bigGlow)"/>
  <circle cx="800" cy="470" r="260" fill="#ff5f8f" opacity="0.35" filter="url(#bigGlow)"/>
  <circle cx="1190" cy="430" r="205" fill="url(#sun)" mask="url(#sunStripes)"/>

  <!-- Hills -->
  <path d="M0 600 L110 528 L220 566 L350 478 L470 548 L570 506 L690 580 L800 566 L920 584 L1040 510 L1150 556 L1275 466 L1395 534 L1505 494 L1600 540 L1600 660 L0 660 Z" fill="url(#farHills)" opacity="0.92"/>
  <path d="M0 650 L90 596 L210 628 L330 566 L455 622 L575 604 L700 646 L900 646 L1030 600 L1150 630 L1270 574 L1400 626 L1510 590 L1600 616 L1600 700 L0 700 Z" fill="url(#nearHills)"/>
  <rect x="0" y="600" width="1600" height="90" fill="url(#haze)"/>

  <!-- Ground + synth grid -->
  <rect x="0" y="646" width="1600" height="254" fill="url(#ground)"/>
  <g stroke="#ff4fa3" stroke-width="2" opacity="0.28">
    <line x1="0" y1="662" x2="1600" y2="662"/>
    <line x1="0" y1="684" x2="1600" y2="684"/>
    <line x1="0" y1="714" x2="1600" y2="714"/>
    <line x1="0" y1="756" x2="1600" y2="756"/>
    <line x1="0" y1="814" x2="1600" y2="814"/>
    <line x1="0" y1="892" x2="1600" y2="892"/>
    <line x1="800" y1="646" x2="-900" y2="900"/>
    <line x1="800" y1="646" x2="-300" y2="900"/>
    <line x1="800" y1="646" x2="2500" y2="900"/>
    <line x1="800" y1="646" x2="1900" y2="900"/>
  </g>

  <!-- Road -->
  <polygon points="780,646 820,646 1760,900 -160,900" fill="url(#road)"/>
  <g stroke="#ff5fb0" stroke-width="10" opacity="0.5" filter="url(#glow)">
    <line x1="780" y1="646" x2="-160" y2="900"/>
    <line x1="820" y1="646" x2="1760" y2="900"/>
  </g>
  <g stroke="#ff8cc6" stroke-width="3">
    <line x1="780" y1="646" x2="-160" y2="900"/>
    <line x1="820" y1="646" x2="1760" y2="900"/>
  </g>

  <!-- "960" roadside sign, a nod to the quattro banner -->
  <g transform="translate(1320 640) rotate(-3)">
    <line x1="10" y1="0" x2="4" y2="170" stroke="#140a1c" stroke-width="7"/>
    <line x1="230" y1="0" x2="236" y2="170" stroke="#140a1c" stroke-width="7"/>
    <rect x="0" y="-8" width="240" height="120" fill="#1d0f2c" stroke="#ff7ab8" stroke-width="3" opacity="0.95"/>
    <text x="120" y="62" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-style="italic" font-weight="700" font-size="58" fill="#ffb3d9" letter-spacing="4">960</text>
    <g fill="#ff7ab8"><rect x="30" y="76" width="180" height="4"/><rect x="30" y="85" width="180" height="4"/><rect x="30" y="94" width="180" height="4"/></g>
  </g>

  <!-- The sun sits right behind the roof, so the air around the car glows -->
  <ellipse cx="800" cy="640" rx="430" ry="130" fill="url(#backGlow)" opacity="0.22"/>
  <rect x="0" y="580" width="1600" height="100" fill="url(#haze)" opacity="0.22"/>

  <!-- Light pools the headlights throw on the road -->
  <ellipse cx="545" cy="878" rx="260" ry="46" fill="url(#warmPool)"/>
  <ellipse cx="1055" cy="878" rx="260" ry="46" fill="url(#warmPool)"/>

  <!-- ===== Volvo 960 ===== -->
  <ellipse cx="800" cy="880" rx="480" ry="28" fill="#000" opacity="0.65" filter="url(#glow)"/>

  <!-- Tyres -->
  <g>
    <rect x="422" y="760" width="106" height="116" rx="22" fill="#0a060e" stroke="#3b2a4c" stroke-width="3"/>
    <rect x="1072" y="760" width="106" height="116" rx="22" fill="#0a060e" stroke="#3b2a4c" stroke-width="3"/>
    <g stroke="#24182e" stroke-width="4">
      <line x1="436" y1="800" x2="514" y2="800"/><line x1="436" y1="824" x2="514" y2="824"/><line x1="436" y1="848" x2="514" y2="848"/>
      <line x1="1086" y1="800" x2="1164" y2="800"/><line x1="1086" y1="824" x2="1164" y2="824"/><line x1="1086" y1="848" x2="1164" y2="848"/>
    </g>
    <line x1="424" y1="782" x2="424" y2="854" stroke="#ff8cc6" stroke-width="2" opacity="0.5"/>
    <line x1="1176" y1="782" x2="1176" y2="854" stroke="#ff8cc6" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Cabin: pillars and roof -->
  <polygon points="566,362 1034,362 1152,562 448,562" fill="url(#pillar)"/>
  <polygon points="590,382 1010,382 1116,550 484,550" fill="url(#glass)"/>
  <!-- interior silhouettes -->
  <g fill="#1a0b28" opacity="0.55">
    <rect x="620" y="452" width="80" height="70" rx="18"/>
    <rect x="900" y="452" width="80" height="70" rx="18"/>
    <ellipse cx="660" cy="536" rx="70" ry="14"/>
  </g>
  <rect x="776" y="388" width="48" height="16" rx="4" fill="#1a0b28" opacity="0.8"/>
  <!-- glass reflections -->
  <polygon points="650,384 712,384 566,550 504,550" fill="#fff" opacity="0.13"/>
  <polygon points="730,384 748,384 606,550 588,550" fill="#fff" opacity="0.09"/>
  <!-- wipers -->
  <g stroke="#0e0716" stroke-width="5" stroke-linecap="round">
    <line x1="520" y1="546" x2="720" y2="522"/>
    <line x1="790" y1="546" x2="990" y2="522"/>
  </g>
  <!-- rim light from the sun behind -->
  <g stroke-linecap="round" fill="none">
    <line x1="566" y1="362" x2="1034" y2="362" stroke="#ffd1e6" stroke-width="4"/>
    <line x1="566" y1="362" x2="448" y2="562" stroke="#ff8cc6" stroke-width="3" opacity="0.85"/>
    <line x1="1034" y1="362" x2="1152" y2="562" stroke="#ff8cc6" stroke-width="3" opacity="0.85"/>
  </g>

  <!-- Mirrors -->
  <polygon points="392,498 456,492 462,542 398,548" fill="url(#body)" stroke="#ff8cc6" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="1208,498 1144,492 1138,542 1202,548" fill="url(#body)" stroke="#ff8cc6" stroke-width="2" stroke-opacity="0.6"/>

  <g stroke="#1b1428" stroke-width="8"><line x1="456" y1="530" x2="476" y2="548"/><line x1="1144" y1="530" x2="1124" y2="548"/></g>
  <!-- Hood -->
  <polygon points="436,558 1164,558 1206,604 394,604" fill="url(#hood)"/>
  <polygon points="520,560 700,560 640,602 430,602" fill="#ffb3d9" opacity="0.18"/>
  <polygon points="1020,560 1110,560 1170,602 1060,602" fill="#ffd0a0" opacity="0.12"/>
  <polygon points="436,558 1164,558 1206,604 394,604" fill="url(#fenderShade)" opacity="0.7"/>
  <line x1="436" y1="558" x2="1164" y2="558" stroke="#ffb3d9" stroke-width="2" opacity="0.7"/>
  <text x="800" y="596" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" letter-spacing="9" fill="#e9dcff" opacity="0.75">VOLVO</text>

  <!-- Front fascia -->
  <polygon points="392,602 1208,602 1216,760 384,760" fill="url(#body)"/>
  <!-- Shading that gives the flat front some roundness: shadowed fenders, a lip
       shadow under the hood, and sheet metal darkening towards the bumper. -->
  <polygon points="392,602 1208,602 1216,760 384,760" fill="url(#panelFall)"/>
  <polygon points="392,602 1208,602 1216,760 384,760" fill="url(#fenderShade)"/>
  <rect x="384" y="602" width="832" height="30" fill="url(#lipShade)"/>
  <line x1="392" y1="602" x2="384" y2="760" stroke="#ff7ab8" stroke-width="3" opacity="0.55"/>
  <line x1="1208" y1="602" x2="1216" y2="760" stroke="#ff7ab8" stroke-width="3" opacity="0.55"/>

  <line x1="400" y1="694" x2="1200" y2="694" stroke="#8c76b0" stroke-width="2" opacity="0.4"/>
  <!-- Indicators -->
  <rect x="402" y="616" width="32" height="60" rx="3" fill="#ff9a3c"/>
  <rect x="1166" y="616" width="32" height="60" rx="3" fill="#ff9a3c"/>

  <!-- Headlights -->
  <rect x="440" y="611" width="214" height="70" rx="4" fill="#0b0812"/>
  <rect x="946" y="611" width="214" height="70" rx="4" fill="#0b0812"/>
  <rect x="448" y="618" width="198" height="56" rx="2" fill="url(#lamp)"/>
  <rect x="954" y="618" width="198" height="56" rx="2" fill="url(#lamp)"/>
  <g stroke="#ffe3a0" stroke-width="2" opacity="0.5">
    <line x1="514" y1="618" x2="514" y2="674"/><line x1="580" y1="618" x2="580" y2="674"/>
    <line x1="1020" y1="618" x2="1020" y2="674"/><line x1="1086" y1="618" x2="1086" y2="674"/>
  </g>

  <!-- Grille with the Volvo diagonal and iron mark -->
  <rect x="680" y="606" width="240" height="82" rx="6" fill="#0a0810" stroke="url(#chrome)" stroke-width="7"/>
  <g fill="#3f3458">
    <rect x="698" y="614" width="6" height="66"/><rect x="720" y="614" width="6" height="66"/>
    <rect x="742" y="614" width="6" height="66"/><rect x="764" y="614" width="6" height="66"/>
    <rect x="786" y="614" width="6" height="66"/><rect x="808" y="614" width="6" height="66"/>
    <rect x="830" y="614" width="6" height="66"/><rect x="852" y="614" width="6" height="66"/>
    <rect x="874" y="614" width="6" height="66"/><rect x="896" y="614" width="6" height="66"/>
  </g>
  <line x1="688" y1="682" x2="912" y2="612" stroke="url(#chrome)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="800" cy="647" r="15" fill="#0a0810" stroke="url(#chrome)" stroke-width="5"/>
  <path d="M809 638 L822 625 M813 624 L822 625 L821 634" stroke="#e6d3ff" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Bumper -->
  <rect x="380" y="700" width="840" height="64" rx="10" fill="#120e18"/>
  <rect x="392" y="712" width="816" height="6" rx="3" fill="#6a5a86"/>
  <rect x="436" y="726" width="84" height="20" rx="4" fill="#ffe8b8"/>
  <rect x="1080" y="726" width="84" height="20" rx="4" fill="#ffe8b8"/>
  <rect x="712" y="722" width="176" height="36" rx="3" fill="#ece8f2" stroke="#1a1420" stroke-width="2"/>
  <rect x="712" y="722" width="20" height="36" rx="2" fill="#2d4bbd"/>
  <text x="812" y="749" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="22" fill="#15121a">AT 960</text>
  <rect x="396" y="762" width="808" height="20" rx="6" fill="#0a070e"/>

  <!-- Headlight bloom -->
  <g filter="url(#glow)" opacity="0.9">
    <rect x="440" y="606" width="214" height="80" rx="10" fill="#fff0c0"/>
    <rect x="946" y="606" width="214" height="80" rx="10" fill="#fff0c0"/>
    <rect x="430" y="722" width="96" height="28" rx="8" fill="#ffe0a0" opacity="0.7"/>
    <rect x="1074" y="722" width="96" height="28" rx="8" fill="#ffe0a0" opacity="0.7"/>
  </g>
  <g filter="url(#blur2)" fill="#fff">
    <ellipse cx="547" cy="646" rx="210" ry="3.5" opacity="0.75"/>
    <ellipse cx="1053" cy="646" rx="210" ry="3.5" opacity="0.75"/>
    <ellipse cx="547" cy="646" rx="3" ry="46" opacity="0.4"/>
    <ellipse cx="1053" cy="646" rx="3" ry="46" opacity="0.4"/>
  </g>

  <!-- Volumetric beams: the headlights cut through the dust either side of the
       car. Kept wide and heavily blurred so they read as haze, not as glass. -->
  <g filter="url(#blur14)">
    <polygon points="452,628 646,628 330,900 -200,900" fill="url(#beam)"/>
    <polygon points="1148,628 954,628 1270,900 1800,900" fill="url(#beam)"/>
  </g>

  <g filter="url(#blur8)" opacity="0.5">
    <ellipse cx="300" cy="884" rx="200" ry="26" fill="#ffdc98"/>
    <ellipse cx="1300" cy="884" rx="200" ry="26" fill="#ffdc98"/>
  </g>

  <!-- Dust kicked up in the backlight -->
  <g fill="#ff9ecb" opacity="0.6">
    <circle cx="360" cy="840" r="3"/><circle cx="330" cy="818" r="2"/><circle cx="300" cy="850" r="2.5"/>
    <circle cx="1250" cy="836" r="3"/><circle cx="1280" cy="812" r="2"/><circle cx="1310" cy="848" r="2.5"/>
    <circle cx="380" cy="796" r="1.6"/><circle cx="1228" cy="790" r="1.6"/>
  </g>
  <!-- Motes drifting through the beams, brighter where the light is strongest -->
  <g fill="#ffe4b5" filter="url(#blur2)">
