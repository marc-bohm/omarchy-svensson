<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Headlight flash overlay; same geometry as volvo-960.svg -->
  <defs>
    <filter id="glow" x="-100%" y="-300%" width="300%" height="700%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <g filter="url(#glow)">
    <rect x="420" y="590" width="254" height="112" rx="30" fill="#fff4cf"/>
    <rect x="926" y="590" width="254" height="112" rx="30" fill="#fff4cf"/>
    <ellipse cx="547" cy="646" rx="330" ry="40" fill="#ffe7a8" opacity="0.7"/>
    <ellipse cx="1053" cy="646" rx="330" ry="40" fill="#ffe7a8" opacity="0.7"/>
  </g>
  <rect x="448" y="618" width="198" height="56" rx="2" fill="#ffffff"/>
  <rect x="954" y="618" width="198" height="56" rx="2" fill="#ffffff"/>
  <!-- Beams brighten with the lamps; geometry matches volvo-960.svg -->
  <defs>
    <linearGradient id="beamFlash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffe7a8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffe096" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur14"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <g filter="url(#blur14)">
    <polygon points="452,628 646,628 330,900 -200,900" fill="url(#beamFlash)"/>
    <polygon points="1148,628 954,628 1270,900 1800,900" fill="url(#beamFlash)"/>
  </g>

  <g filter="url(#blur2)" fill="#fff">
    <ellipse cx="547" cy="646" rx="420" ry="5"/>
    <ellipse cx="1053" cy="646" rx="420" ry="5"/>
    <ellipse cx="547" cy="646" rx="4" ry="90" opacity="0.6"/>
    <ellipse cx="1053" cy="646" rx="4" ry="90" opacity="0.6"/>
  </g>
</svg>
